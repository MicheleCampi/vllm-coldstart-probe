[workspace]
resolver = "2"
members = [
    "probe-common",
    "probe",
    "probe-ebpf",
]
default-members = [
    "probe-common",
    "probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/MicheleCampi/vllm-coldstart-probe"
authors = ["Michele Campi"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# eBPF programs require maximum optimization and abort-on-panic regardless
# of profile, because the kernel verifier rejects unoptimized bytecode and
# eBPF does not support unwinding. These profile overrides apply to the
# `probe-ebpf` package specifically. Userspace crates (`probe`, `probe-common`)
# use cargo defaults.
[profile.dev.package.probe-ebpf]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1

[profile.release.package.probe-ebpf]
debug = false
codegen-units = 1
