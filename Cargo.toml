[workspace]
resolver = "2"
members = [
    "probe-common",
    "probe",

]
exclude = [
    "probe-ebpf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/MicheleCampi/vllm-coldstart-probe"
authors = ["Michele Campi"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
