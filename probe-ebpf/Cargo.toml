[package]
name = "probe-ebpf"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
aya-ebpf = "0.1.1"
aya-log-ebpf = "0.1.0"
probe-common = { path = "../probe-common" }

[[bin]]
name = "probe"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
